<section><div class="inner">    <!-- signature: interactive core-swap schematic -->
    <div class="schematic" aria-label="Interactive diagram: the Core module moving between the Wing handheld and the Nest dock">
      <div class="plate">
        <span>FIG. 1 — CORE INTERCHANGE</span>
        <div class="mode-toggle" role="group" aria-label="Select mode">
          <button id="btnHandheld" aria-pressed="true">Handheld</button>
          <button id="btnDocked" aria-pressed="false">Docked</button>
        </div>
      </div>

      <svg id="figSvg" viewBox="0 0 920 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figTitle">
        <title id="figTitle">The Zaman Core sliding between the Wing handheld's rear bay and the Nest dock's top bay</title>

        <!-- WING (handheld, rear view) -->
        <g id="wingGroup" stroke="#f2ece0" fill="none" stroke-width="1.5">
          <!-- shoulder buttons -->
          <rect x="92" y="112" width="58" height="11" rx="5"></rect>
          <rect x="320" y="112" width="58" height="11" rx="5"></rect>
          <!-- body -->
          <rect x="60" y="122" width="350" height="178" rx="54"></rect>
          <!-- grip texture hints -->
          <path d="M86 162 q-7 42 0 84 M384 162 q7 42 0 84" opacity=".4"></path>
          <!-- vents -->
          <path d="M120 152 h58 M120 162 h58" stroke-dasharray="3 4" opacity=".7"></path>
          <path d="M292 152 h58 M292 162 h58" stroke-dasharray="3 4" opacity=".7"></path>
          <!-- rear buttons -->
          <rect x="100" y="248" width="28" height="11" rx="4" opacity=".6"></rect>
          <rect x="342" y="248" width="28" height="11" rx="4" opacity=".6"></rect>
          <!-- USB-C -->
          <rect x="218" y="294" width="34" height="9" rx="4"></rect>
          <!-- core bay (rear, square) -->
          <rect x="190" y="160" width="90" height="90" rx="8" stroke-dasharray="6 5" stroke="#c47542"></rect>
          <text x="235" y="150" text-anchor="middle" fill="#c47542" stroke="none" font-size="10" letter-spacing="2">J1 CORE BAY</text>
          <text x="235" y="343" text-anchor="middle" fill="#f2ece0" stroke="none" font-size="13" letter-spacing="3">A1 — WING (REAR)</text>
          <text x="235" y="363" text-anchor="middle" fill="#a8997f" stroke="none" font-size="10" letter-spacing="1">6″ OLED · 120 Hz · 6000 mAh</text>
        </g>

        <!-- NEST (dock, low console) -->
        <g id="nestGroup" class="chassis-dim" stroke="#f2ece0" fill="none" stroke-width="1.5">
          <!-- body -->
          <rect x="540" y="205" width="340" height="100" rx="10"></rect>
          <!-- seam light -->
          <path d="M542 256 h336" stroke="#e6b25a" stroke-width="2" opacity=".85"></path>
          <!-- side vents -->
          <path d="M552 218 v76 M559 218 v76 M566 218 v76" stroke-dasharray="3 4" opacity=".55"></path>
          <path d="M854 218 v76 M861 218 v76 M868 218 v76" stroke-dasharray="3 4" opacity=".55"></path>
          <!-- front ports -->
          <rect x="690" y="276" width="18" height="11" rx="2" opacity=".8"></rect>
          <rect x="716" y="276" width="18" height="11" rx="2" opacity=".8"></rect>
          <rect x="742" y="276" width="26" height="9" rx="2" opacity=".8"></rect>
          <!-- power ring -->
          <circle cx="828" cy="240" r="11"></circle>
          <circle cx="828" cy="240" r="4" fill="#e6b25a" stroke="none"></circle>
          <!-- core bay on top (sized for the flattened slab) -->
          <rect x="664" y="206" width="120" height="46" rx="5" stroke-dasharray="6 5" stroke="#c47542"></rect>
          <text x="724" y="196" text-anchor="middle" fill="#c47542" stroke="none" font-size="10" letter-spacing="2">J2 CORE BAY</text>
          <text x="710" y="343" text-anchor="middle" fill="#f2ece0" stroke="none" font-size="13" letter-spacing="3">A2 — NEST</text>
          <text x="710" y="363" text-anchor="middle" fill="#a8997f" stroke="none" font-size="10" letter-spacing="1">FULL TDP · FULL I/O · BIG-SCREEN</text>
        </g>

        <!-- CORE (movable cartridge — flattens to lie flat when docked) -->
        <g id="coreGroup" transform="translate(190,160)">
          <g id="coreSlab">
            <rect x="0" y="0" width="90" height="90" rx="10" fill="#251e15" stroke="#e6b25a" stroke-width="1.5"></rect>
            <!-- seam light across slab -->
            <path d="M8 45 h74" stroke="#e6b25a" stroke-width="2" opacity=".85" fill="none"></path>
            <!-- gold edge fingers -->
            <g fill="#c47542">
              <rect x="16" y="82" width="6" height="8"></rect><rect x="27" y="82" width="6" height="8"></rect>
              <rect x="38" y="82" width="6" height="8"></rect><rect x="49" y="82" width="6" height="8"></rect>
              <rect x="60" y="82" width="6" height="8"></rect><rect x="71" y="82" width="6" height="8"></rect>
            </g>
          </g>
          <!-- silkscreen, face view (handheld) -->
          <g id="coreText">
            <text x="45" y="34" text-anchor="middle" fill="#e6b25a" font-size="13" letter-spacing="3">ZAMAN</text>
            <text x="45" y="66" text-anchor="middle" fill="#a8997f" font-size="9" letter-spacing="2">U1 CORE</text>
          </g>
          <!-- silkscreen, flat view (docked) -->
          <text id="coreTextH" x="45" y="72" text-anchor="middle" fill="#e6b25a" font-size="9" letter-spacing="2">U1 CORE</text>
        </g>
      </svg>

      <p class="mode-caption" id="modeCaption" aria-live="polite">MODE A — HANDHELD: CORE SEATS IN THE WING'S REAR BAY · 6″ OLED · 6000 mAh</p>
    </div>
</div></section>
